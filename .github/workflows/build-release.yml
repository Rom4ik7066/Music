name: Build Windows release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Set release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          Set-Content -Path app_version.py -Value @(
            "APP_VERSION = `"$version`""
            "DISPLAY_VERSION = `"v$version`""
          ) -Encoding utf8

      - name: Build application
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onefile
          --name MyMusic --workpath "build\pyinstaller" --distpath "dist"
          --specpath "build" --hidden-import webview.platforms.edgechromium
          --hidden-import webview.platforms.winforms app.pyw

      - name: Upload executable to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:RELEASE_TAG" dist/MyMusic.exe --clobber